
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <link rel="canonical"
        href="{{ page.url | absolute_url }}">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <div class="site-container">

    <header class="site-header">
      <a href="{{ '/' | relative_url }}"
         class="site-logo">
        CLIMBING FKT
      </a>

      <nav aria-label="Main navigation">
        <a href="{{ '/records/' | relative_url }}">
          Records
        </a>
        <a href="{{ '/submit/' | relative_url }}">
          Submit
        </a>
        <a href="{{ '/about/' | relative_url }}">
          About
        </a>
      </nav>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}

  </div>
</body>
</html>
